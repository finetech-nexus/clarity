# Build and push Clarity images on push to main.
# Tags: latest, <short-sha>
# Secrets: DOCKER_USER, DOCKER_PASSWORD. Optional var: DOCKER_ORGANIZATION (default nexusbank).
name: Build and push images

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  DOCKER_ORGANIZATION: ${{ vars.DOCKER_ORGANIZATION || 'nexusbank' }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: clarity-api
            context: .
            file: ./Dockerfile
          - image: clarity-web
            context: ./frontend
            file: ./frontend/Dockerfile
            build_args: |
              NEXT_PUBLIC_API_URL=https://clarity.api.dev.sandbox.internal.nbank.fr
              CLARITY_API_UPSTREAM=http://clarity-api.kyc-aml.svc.cluster.local:8095
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Git short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.DOCKER_ORGANIZATION }}/${{ matrix.image }}:latest
            ${{ env.DOCKER_ORGANIZATION }}/${{ matrix.image }}:${{ steps.sha.outputs.short_sha }}
